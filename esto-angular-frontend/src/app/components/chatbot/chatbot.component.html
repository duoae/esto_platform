<!-- Chat Button -->
<button 
  (click)="toggleChat()"
  class="fixed bottom-6 right-6 w-16 h-16 bg-[#c4694b] text-white rounded-full shadow-[0_0_20px_rgba(196,105,75,0.4)] hover:shadow-[0_0_30px_rgba(196,105,75,0.6)] transition-all duration-300 flex items-center justify-center z-[60] focus:outline-none animate-float-bot"
  [ngClass]="{'scale-90': isOpen}">
  <div *ngIf="!isOpen" class="animate-wave-hand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-10 h-10">
      <circle cx="12" cy="3" r="2" />
      <rect x="11" y="5" width="2" height="3" />
      <rect x="3" y="11" width="3" height="6" rx="1" />
      <rect x="18" y="11" width="3" height="6" rx="1" />
      <rect x="5" y="8" width="14" height="12" rx="3" />
      <circle cx="9" cy="13" r="2" fill="#c4694b" />
      <circle cx="15" cy="13" r="2" fill="#c4694b" />
      <!-- Cute smile -->
      <path d="M8.5 16.5 Q12 19.5 15.5 16.5" stroke="#c4694b" stroke-width="1.5" fill="none" stroke-linecap="round" />
    </svg>
  </div>
  <svg *ngIf="isOpen" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
  </svg>
</button>

<!-- Chat Window -->
<div 
  [@openClose]="isOpen ? 'open' : 'closed'"
  class="fixed bottom-24 right-6 w-96 h-[500px] bg-white rounded-2xl shadow-2xl flex flex-col z-50 overflow-hidden border border-gray-100 origin-bottom-right">
  
  <!-- Header -->
  <div class="bg-gradient-to-r from-[#d17557] to-[#c4694b] p-4 text-white shadow-md flex items-center justify-between border-b border-white/20">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center shadow-inner border border-white/40 overflow-hidden">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 text-white animate-wave-hand">
          <circle cx="12" cy="3" r="2" />
          <rect x="11" y="5" width="2" height="3" />
          <rect x="3" y="11" width="3" height="6" rx="1" />
          <rect x="18" y="11" width="3" height="6" rx="1" />
          <rect x="5" y="8" width="14" height="12" rx="3" />
          <circle cx="9" cy="13" r="1.5" fill="#c4694b" />
          <circle cx="15" cy="13" r="1.5" fill="#c4694b" />
          <path d="M8.5 16.5 Q12 19.5 15.5 16.5" stroke="#c4694b" stroke-width="1.5" fill="none" stroke-linecap="round" />
        </svg>
      </div>
      <div>
        <h3 class="font-bold text-lg leading-tight tracking-wide">ESTO-Bot</h3>
        <p class="text-[11px] font-medium text-orange-50 flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-green-300 animate-pulse"></span> En ligne
        </p>
      </div>
    </div>
    <button (click)="toggleChat()" class="text-white/80 hover:text-white focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>
  </div>

  <!-- Messages Container -->
  <div id="chat-messages-container" class="flex-1 p-4 overflow-y-auto bg-gray-50 flex flex-col space-y-4 custom-scrollbar">
    
    <div *ngFor="let msg of messages" class="flex" [ngClass]="{'justify-end': msg.sender === 'user', 'justify-start': msg.sender === 'bot'}">
      <!-- Bot Avatar -->
      <div *ngIf="msg.sender === 'bot'" class="w-8 h-8 rounded-full bg-[#fdf3f0] flex items-center justify-center mr-2 flex-shrink-0 self-end mb-1 border border-[#eed3cb]">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-[#c4694b]">
          <circle cx="12" cy="3" r="2" />
          <rect x="11" y="5" width="2" height="3" />
          <rect x="3" y="11" width="3" height="6" rx="1" />
          <rect x="18" y="11" width="3" height="6" rx="1" />
          <rect x="5" y="8" width="14" height="12" rx="3" />
          <circle cx="9" cy="13" r="1.5" fill="white" />
          <circle cx="15" cy="13" r="1.5" fill="white" />
          <path d="M8.5 16.5 Q12 19.5 15.5 16.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" />
        </svg>
      </div>
      
      <!-- Message Bubble -->
      <div 
        class="max-w-[75%] px-4 py-2.5 rounded-2xl shadow-sm relative text-sm font-medium"
        [ngClass]="msg.sender === 'user' ? 'bg-gradient-to-r from-[#d17557] to-[#c4694b] text-white rounded-br-none shadow-[0_4px_10px_rgba(196,105,75,0.2)]' : 'bg-white text-gray-700 border border-gray-100 rounded-bl-none shadow-sm'">
        <p class="whitespace-pre-wrap">{{ msg.text }}</p>
        <span 
          class="text-[10px] mt-1 block"
          [ngClass]="msg.sender === 'user' ? 'text-white/70 text-right' : 'text-gray-400'">
          {{ msg.timestamp | date:'HH:mm' }}
        </span>
      </div>
    </div>

    <!-- Typing Indicator -->
    <div *ngIf="isTyping" class="flex justify-start items-end mt-2">
      <div class="w-8 h-8 rounded-full bg-[#fdf3f0] flex items-center justify-center mr-2 flex-shrink-0 border border-[#eed3cb]">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-[#c4694b]">
          <circle cx="12" cy="3" r="2" />
          <rect x="11" y="5" width="2" height="3" />
          <rect x="3" y="11" width="3" height="6" rx="1" />
          <rect x="18" y="11" width="3" height="6" rx="1" />
          <rect x="5" y="8" width="14" height="12" rx="3" />
          <circle cx="9" cy="13" r="1.5" fill="white" />
          <circle cx="15" cy="13" r="1.5" fill="white" />
          <path d="M8.5 16.5 Q12 19.5 15.5 16.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" />
        </svg>
      </div>
      <div class="bg-white px-4 py-3 rounded-2xl rounded-bl-none shadow-sm border border-gray-100 flex space-x-1.5 items-center h-[38px]">
        <div class="w-1.5 h-1.5 bg-[#c4694b]/60 rounded-full animate-bounce" style="animation-delay: 0ms"></div>
        <div class="w-1.5 h-1.5 bg-[#c4694b]/60 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
        <div class="w-1.5 h-1.5 bg-[#c4694b]/60 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
      </div>
    </div>
    
  </div>

  <!-- Input Area -->
  <div class="p-3 bg-white border-t border-gray-100 flex items-center shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.02)]">
    <input 
      type="text" 
      [(ngModel)]="newMessage" 
      (keyup.enter)="sendMessage()"
      placeholder="Posez votre question au Bot..." 
      class="flex-1 bg-gray-50 border border-gray-200 rounded-full px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#c4694b]/40 focus:border-[#c4694b]/50 transition-all text-gray-700">
    
    <button 
      (click)="sendMessage()"
      [disabled]="!newMessage.trim() || isTyping"
      class="ml-2 w-10 h-10 bg-gradient-to-r from-[#d17557] to-[#c4694b] text-white rounded-full flex items-center justify-center hover:shadow-[0_4px_12px_rgba(196,105,75,0.4)] transition-all disabled:opacity-50 disabled:cursor-not-allowed flex-shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transform rotate-90" viewBox="0 0 20 20" fill="currentColor">
        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
      </svg>
    </button>
  </div>
</div>
